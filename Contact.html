<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="Images/favicon-32x32.png">
    <title>Imagine Dragons-Contact</title>
    <link href="bootstrap_class/css/bootstrap.min.css" rel="stylesheet">
    <link href="band.css" rel="stylesheet">
    <script src="bootstrap_class/js/bootstrap.bundle.min.js" defer></script>
</head>




<body>

    <h1 class="Title pt-4">Contacts</h1>

    <div class="container-lg pb-5">
        <form class="Box container-lg px-4 mt-5 py-4">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" placeholder="name@example.com" required class="form-control" id="exampleInputEmail1"
                    aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text Title">Trust-We'll never share your email with anyone else.</div>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">What do you want to share with us?</label>
                <textarea type="email" class="form-control" id="message rows=5"
                    aria-describedby="emailHelp"> </textarea>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" required class="form-check-input checkbox" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">I agree to all terms and conditions</label>
            </div>

            <div class="mb-3">
                <label for="formFileMultiple" class="form-label">Upload Picks</label>
                <input class="form-control" type="file" id="formFileMultiple" multiple>
            </div>

            <div class="d-flex justify-content-between">
                <a href="About Us.html" type="reset" class="btn cancel-button">✕ Cancel</a>
                <button type="submit" class="btn send-button">Send→</button>
            </div>
        </form>
    </div>

    <footer class="Footer pb-2">
        <div class="content-anchor">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item">
                    <a href="https://www.youtube.com/playlist?list=PLMp5rDgAZPCi51aybeg5YZwvTPbBDT3a8"
                        class="nav-link px-2 text-white"><img src="Images/YT.png" width=50px></a>
                </li>
                <li class="nav-item">
                    <a href="https://www.instagram.com/imaginedragons/" class="nav-link px-2 text-white"><img
                            src="Images/IG.png" width=50px></a>
                </li>
                <li class="nav-item">
                    <a href="https://open.spotify.com/artist/53XhwfbYqKCa1cC15pYq2q"
                        class="nav-link px-2 text-white"><img src="Images/Spotify.png" width=50px></a>
            </ul>
        </div>
        <p class="text-center">© 2026 Imagine Dragon.AG | School Project</p>
    </footer>

</body>



</html>
